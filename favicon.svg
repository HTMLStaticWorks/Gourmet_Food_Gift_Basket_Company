<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#logoGrad)" />
  <g fill="#ffffff">
    <!-- Gift basket base -->
    <path d="M140,330 Q140,380 160,390 L352,390 Q372,380 372,330 L360,240 L152,240 Z" opacity="0.9" />
    <!-- Basket weave lines -->
    <path d="M165,270 L347,270 M165,300 L347,300 M165,330 L347,330 M165,360 L347,360" stroke="#d4a017" stroke-width="6" fill="none" opacity="0.5"/>
    <path d="M200,240 L185,390 M240,240 L230,390 M280,240 L282,390 M320,240 L327,390" stroke="#d4a017" stroke-width="5" fill="none" opacity="0.4"/>
    <!-- Ribbon horizontal -->
    <rect x="220" y="235" width="72" height="155" rx="4" fill="#d4a017" opacity="0.7"/>
    <!-- Ribbon bow left loop -->
    <ellipse cx="200" cy="195" rx="55" ry="30" transform="rotate(-30 200 195)" fill="#ffffff" opacity="0.9"/>
    <!-- Ribbon bow right loop -->
    <ellipse cx="312" cy="195" rx="55" ry="30" transform="rotate(30 312 195)" fill="#ffffff" opacity="0.9"/>
    <!-- Ribbon center knot -->
    <circle cx="256" cy="210" r="22" fill="#d4a017"/>
    <!-- Bow vertical piece -->
    <rect x="244" y="140" width="24" height="75" rx="4" fill="#ffffff" opacity="0.9"/>
    <!-- Decorative leaves -->
    <ellipse cx="165" cy="210" rx="28" ry="14" transform="rotate(-45 165 210)" fill="#2d6a4f" opacity="0.85"/>
    <ellipse cx="347" cy="210" rx="28" ry="14" transform="rotate(45 347 210)" fill="#2d6a4f" opacity="0.85"/>
  </g>
</svg>
